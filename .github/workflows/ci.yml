name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_ENV: test
  DATABASE_URL: "file:./dev.db"
  AUTH_SECRET: "ci_pipeline_secret_test_key_32chars_long!!"
  AUTH_URL: "http://localhost:3000"
  AUTH_TRUST_HOST: "true"
  NEXT_PUBLIC_APP_URL: "http://localhost:3000"

jobs:
  test-and-build:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Setup SQLite Database & Seed Demo Data
        run: |
          npx prisma migrate deploy
          npm run db:seed

      - name: Typecheck & Lint
        run: npm run lint

      - name: Run Unit & Integration Tests (Vitest)
        run: npm test

      - name: Production Build (Next.js)
        run: npm run build

      - name: Install Playwright Chromium & System Dependencies
        run: npx playwright install --with-deps chromium

      - name: Run End-to-End Tests (Playwright)
        run: npm run test:e2e
        env:
          CI: true

      - name: Upload Playwright Test Report on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
